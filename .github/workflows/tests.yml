name: Testes

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Executar testes
        run: scripts/test.sh
      - name: Validar empacotamento
        run: scripts/package-app.sh 0.0.0
      - name: Conferir conteúdo do ZIP e checksum
        run: |
          unzip -l dist/RetroX-0.0.0-macos-arm64.zip | grep 'RetroX.app/Contents/MacOS/RetroX'
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
      - name: Disponibilizar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: RetroX-macos-arm64
          path: |
            dist/RetroX-0.0.0-macos-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
