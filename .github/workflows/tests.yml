name: Testes

on:
  pull_request:
  push:
    branches-ignore: [main, beta]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Registrar commit e toolchain
        run: |
          git rev-parse HEAD
          xcodebuild -version
          swift --version
      - name: Executar testes
        shell: bash
        run: |
          mkdir -p test-results
          scripts/test.sh 2>&1 | tee test-results/unit.log
      - name: Integração com emulador falso (sem janela)
        shell: bash
        run: scripts/integration-launch.sh --process-only 2>&1 | tee test-results/process-integration.log
      - name: Guardar logs de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroX-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Validar empacotamento
        run: scripts/package-app.sh 0.0.0
      - name: Verificar pacote extraído
        run: scripts/verify-package.sh 0.0.0
      - name: Disponibilizar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: RetroX-macos-arm64
          path: |
            dist/RetroX-0.0.0-macos-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
